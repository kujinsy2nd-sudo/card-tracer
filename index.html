<!doctype html>
<html lang="ja">
<head>
　<link rel="icon" type="image/png" href="./icon.png">
　<link rel="apple-touch-icon" href="./icon.png">  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カードトレーサー | ショップ横断検索</title>
  <style>
    :root{--navy:#101a3b;--blue:#2866e8;--pale:#edf3ff;--bg:#f6f8fc;--ink:#19213b;--muted:#69728c;--line:#e3e8f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}header{background:var(--navy);color:#fff}.top{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900}.brand b{color:#7da7ff}.sub{font-size:13px;color:#cfdbff}.hero{padding:44px 0 38px;background:linear-gradient(125deg,#101a3b,#1d3d83);color:#fff}.hero h1{margin:0;font-size:clamp(27px,5vw,42px);line-height:1.2}.hero p{margin:10px 0 0;color:#d8e3ff}.search{display:flex;gap:9px;padding:8px;margin-top:24px;background:#fff;border-radius:14px;box-shadow:0 13px 30px #07123855}.search input{flex:1;min-width:0;border:0;outline:0;padding:12px;color:var(--ink);font:inherit}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;cursor:pointer;font:800 14px inherit}.btn:hover{filter:brightness(1.08)}.btn.danger{background:#fff0ec;color:#b63b28;padding:8px 10px;font-size:12px}main{padding:30px 0 54px}.note{padding:13px 15px;border:1px solid #cadbff;border-radius:10px;background:#eff5ff;color:#35518d;font-size:13px}.historybox{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}.historyhead{display:flex;justify-content:space-between;align-items:center}.historyhead h2{margin:0;font-size:15px}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:25px 0 13px}.head h2{margin:0;font-size:19px}.result{color:var(--muted);font-size:13px}.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.shop{display:flex;flex-direction:column;gap:10px;min-height:132px;padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff}.shop h3{margin:0;font-size:16px}.shop p{flex:1;margin:3px 0;color:var(--muted);font-size:12px}.open{display:block;border-radius:8px;padding:9px;background:var(--pale);color:#214baf;text-align:center;text-decoration:none;font-size:13px;font-weight:800}.open:hover{background:#dce8ff}.history{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.history button{border:1px solid var(--line);border-radius:99px;padding:8px 11px;background:#fff;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}.history button:hover{border-color:#a9c2f8;background:var(--pale)}.empty{margin:10px 0 0;color:var(--muted);font-size:13px}.all{margin-top:16px}.foot{margin-top:17px;color:var(--muted);font-size:12px;line-height:1.6}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}@media(max-width:720px){.shops{grid-template-columns:1fr 1fr}.sub{display:none}}@media(max-width:440px){.wrap{width:calc(100% - 22px)}.hero{padding:34px 0 28px}.shops{grid-template-columns:1fr}.search .btn{padding:11px 12px}}
  </style>
</head>
<body>
  <header><div class="wrap top"><div class="brand">カード<b>トレーサー</b></div><div class="sub">遊戯王カード・ショップ横断検索</div></div></header>
  <section class="hero"><div class="wrap"><h1>カード名を一度入力して、<br>ショップごとに探す。</h1><p>価格を収集・保存せず、各ショップの検索結果へ移動するランチャー。</p><form class="search" id="form"><input id="query" autocomplete="off" placeholder="例：青眼の白龍、SDK-001"><button class="btn">ショップを表示</button></form></div></section>
  <main class="wrap"><div class="note">ℹ️ 検索結果は各ショップまたは検索エンジン上で確認します。このアプリは価格データを取得・複製しません。</div><section class="historybox"><div class="historyhead"><h2>検索履歴</h2><button class="btn danger" id="clearHistory" type="button">履歴を消す</button></div><div class="history" id="history"></div></section><div class="head"><h2 id="title">ショップを選んで検索</h2><span class="result" id="count"></span></div><section class="shops" id="shops"></section><p class="foot">検索先は各ショップの公式ドメインを指定した通常のウェブ検索です。</p></main><footer><div class="wrap">カードトレーサー 試作版 · 各ショップの利用規約・検索結果はそれぞれのサイトで確認してください。</div></footer>
  <script>
    const stores=[['遊々亭','yuyu-tei.jp'],['フルアヘッド','fullahead-yugi.com'],['カードラッシュ','cardrush.jp'],['まんぞく屋','shopmanzokuya.com'],['ドラゴンスター','dorasuta.jp'],['ホビーステーション','hobbystation-single.jp'],['フルコンプ','shopping.fullcomp.jp'],['トレコロ','torecolo.jp'],['カードラボ','c-labo-online.jp']];
    const $=id=>document.getElementById(id),key='rare-search-launcher-history-v1';let query='',history=JSON.parse(localStorage.getItem(key)||'[]');
    const url=domain=>'https://www.google.com/search?q='+encodeURIComponent('site:'+domain+' '+query);
    function render(){ $('title').textContent=query?'「'+query+'」の検索先':'ショップを選んで検索';$('count').textContent=query?stores.length+'店舗':'カード名を入力してね';$('shops').innerHTML=stores.map(([name,domain])=>`<article class="shop"><h3>${name}</h3><p>${domain}</p><a class="open" href="${url(domain)}" target="_blank" rel="noopener noreferrer">検索結果を開く</a></article>`).join('');$('history').innerHTML=history.length?history.map(x=>`<button type="button" data-q="${x.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${x}</button>`).join(''):'<p class="empty">検索したカード名がここに残るよ。</p>';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{query=b.dataset.q;$('query').value=query;render()})}
    $('form').onsubmit=e=>{e.preventDefault();query=$('query').value.trim();if(!query)return;history=[query,...history.filter(x=>x!==query)].slice(0,12);localStorage.setItem(key,JSON.stringify(history));render()};$('clearHistory').onclick=()=>{history=[];localStorage.removeItem(key);render()};render();
  </script>
</body>
</html>
